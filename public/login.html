<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png">
<title>Family — sign in</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1420;color:#f2f4f8;font:17px/1.4 system-ui,-apple-system,sans-serif;padding:20px;box-sizing:border-box}
  form{background:#1a2130;padding:28px;border-radius:18px;width:100%;max-width:360px;text-align:center}
  img{width:84px;height:84px;border-radius:20px}
  h1{font-size:22px;margin:12px 0 18px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid #2a3345;background:#0f1420;color:inherit;margin-bottom:12px}
  button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:12px;background:#4f8cff;color:#fff;cursor:pointer}
  .err{color:#ff8a8d;min-height:1.4em;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<form id="f">
  <img src="/icons/icon-180.png" alt="">
  <h1>Family</h1>
  <input type="password" name="password" placeholder="Family password" autocomplete="current-password" autofocus required>
  <button>Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: e.target.password.value }) });
  if (r.ok) { const next = new URLSearchParams(location.search).get('next') || '/'; location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/'; }
  else { const j = await r.json().catch(() => ({})); document.getElementById('err').textContent = j.error || 'Wrong password'; }
};
</script>
</body>
</html>
